name: NETI CI/CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neti-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django and Playwright / PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: neti
          POSTGRES_USER: neti
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U neti -d neti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DB_ENGINE: postgresql
      DJANGO_SECRET_KEY: ci-only-django-key
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: neti
      POSTGRES_USER: neti
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Set PostgreSQL port
        env:
          POSTGRES_SERVICE_PORT: ${{ job.services.postgres.ports[5432] }}
        run: echo "POSTGRES_PORT=$POSTGRES_SERVICE_PORT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/e2e.txt
      - run: python neti/manage.py check
      - run: python neti/manage.py makemigrations --check --dry-run
      - run: python neti/manage.py migrate --noinput
      - run: python neti/manage.py collectstatic --noinput
      - run: python neti/manage.py test
      - name: Install Chromium
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Run browser tests
        run: python neti/manage.py test project.e2e_tests

  container:
    name: Production container
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: neti-ci
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --wait postgres
      - name: Build and migrate
        run: |
          docker build --tag neti-ci .
          docker run --rm --network neti-ci_default --env-file .env \
            -e POSTGRES_HOST=postgres -e DJANGO_DEBUG=False neti-ci \
            python neti/manage.py migrate --noinput
      - name: Check HTTP responses
        run: |
          docker run -d --name neti-ci-web --network neti-ci_default \
            --env-file .env -e POSTGRES_HOST=postgres -e DJANGO_DEBUG=False \
            -p 127.0.0.1:8000:8000 neti-ci
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-max-time 45 --max-time 5 \
            http://127.0.0.1:8000/project/ --output /dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/static/css/bootstrap.min.css --output /dev/null
      - name: Container logs
        if: failure()
        run: |
          docker compose logs
          docker logs neti-ci-web

  publish:
    name: Publish to GHCR
    needs: [test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:sha-$GITHUB_SHA" --tag "$image:latest" .
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
