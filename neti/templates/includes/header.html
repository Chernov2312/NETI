<nav class="container" aria-label="Основная навигация">
  <a class="navbar-brand d-inline-flex align-items-center gap-2" href="{% url 'home:home' %}"
     {% if request.resolver_match.view_name == 'home:home' %}aria-current="page"{% endif %}>
    <span class="site-brand-mark rounded-2 bg-primary-subtle text-primary-emphasis px-2 py-1 fw-bold lh-1" aria-hidden="true">N</span>
    NETI
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
    <span class="navbar-toggler-icon"></span>
  </button>
  
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav me-auto mb-2 mb-md-0">
      <li class="nav-item">
        <a class="nav-link" href="{% url 'project:project_list' %}"
           {% if request.resolver_match.view_name == 'project:project_list' %}aria-current="page"{% endif %}>Проекты</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{% url 'project:opportunity_list' %}"
           {% if request.resolver_match.view_name == 'project:opportunity_list' %}aria-current="page"{% endif %}>Биржа заданий</a>
      </li>
      {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'user:projects' %}"
             {% if request.resolver_match.view_name == 'user:projects' %}aria-current="page"{% endif %}>Мои проекты</a>
        </li>
      {% endif %}
      {% if user.can_moderate_projects %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'project:report_list' %}"
             {% if request.resolver_match.view_name == 'project:report_list' %}aria-current="page"{% endif %}>Жалобы</a>
        </li>
      {% endif %}
    </ul>

    <div class="d-flex align-items-center gap-2">
      {% if user.is_authenticated %}
        <a class="btn btn-outline-secondary btn-sm px-3 rounded-pill"
           href="{% url 'user:profile' %}" {% if request.resolver_match.view_name == 'user:profile' %}aria-current="page"{% endif %}>Профиль</a>
        <form method="post" action="{% url 'authentication:logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-secondary btn-sm px-3 rounded-pill">Выйти</button>
        </form>
      {% else %}
        <a class="btn btn-outline-secondary btn-sm px-3 rounded-pill"
           href="{% url 'authentication:login' %}">Войти</a>
        <a class="btn btn-accent btn-sm px-3 rounded-pill"
           href="{% url 'authentication:registration' %}">Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>
