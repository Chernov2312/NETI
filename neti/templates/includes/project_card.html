<div class="card h-100 shadow-sm border border-light-subtle rounded-3 bg-white position-relative transition-hover">
    <div class="position-relative overflow-hidden border-bottom" style="height: 200px; border-top-left-radius: calc(0.375rem - 1px); border-top-right-radius: calc(0.375rem - 1px);">
    	<img src="{{ project.main_image.get_image_300x300 }}" class="w-100 h-100 object-fit-cover" alt="{{ project.name }}">
        
        <div class="position-absolute top-0 end-0 m-2 bg-dark bg-opacity-75 text-warning px-2 py-1 rounded small fw-bold shadow-sm">
            ★ {{ project.average_rating|default:"0.0"|floatformat:1 }}
        </div>
    </div>

    <div class="card-body d-flex flex-column p-4">
        
        <div class="text-muted small mb-2 d-flex align-items-center gap-1">
            <span class="text-primary-emphasis fw-medium">@{{ project.user.username }}</span>
        </div>

        <h5 class="card-title fw-bold text-dark mb-2 text-truncate" title="{{ project.name }}">
            {{ project.name }}
        </h5>

        <p class="card-text text-muted small mb-4 flex-grow-1">
            {{ project.description|default:"Описание отсутствует."|truncatechars:120 }}
        </p>

        <div class="mb-3 d-flex flex-wrap gap-1">
            {% for tag in project.tags.all %}
                <span class="badge bg-secondary-subtle text-secondary-emphasis fw-semibold rounded-pill px-2 py-1" style="font-size: 0.7rem;">
                    #{{ tag.name }}
                </span>
            {% empty %}
                <span class="text-muted small-8" style="font-size: 0.75rem;">Без тегов</span>
            {% endfor %}
        </div>

        <div class="mt-auto border-top pt-3 border-light-subtle">
            <a href="{% url 'project:project_detail' project.id %}" class="btn btn-primary btn-sm w-100 rounded-pill fw-medium py-2">
                Открыть проект
            </a>
        </div>

    </div>
</div>
