{% extends "base.html" %}

{% block title %}Удаление проекта — NETI{% endblock %}

{% block maincontent %}
<div class="container py-5">
  <h1 class="h2 mb-3">Удалить проект «{{ project.name }}»?</h1>
  <p>Вместе с проектом будут удалены его файлы и оценки.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить проект</button>
    <a href="{% url 'project:project_detail' project.pk %}" class="btn btn-outline-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
