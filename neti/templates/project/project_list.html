{% extends "base.html" %}

{% block maincontent %}
<div class="container py-5">
    <h2 class="fw-bold text-dark mb-4">Каталог проектов</h2>
    
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        {% for project in projects %}
            <div class="col">
                {% include "includes/project_card.html" %}
            </div>
        {% empty %}
            <div class="col-12 text-center py-5">
                <h4 class="text-muted">Проекты пока не созданы.</h4>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
