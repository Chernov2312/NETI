{% extends "base.html" %}

{% block title %}Обратная связь — NETI{% endblock %}

{% block maincontent %}
<div class="container py-5">
  <div class="mx-auto col-md-8 col-lg-6">
    <h1 class="h2 mb-4">Обратная связь</h1>
    {% for message in messages %}
      <p class="alert alert-success" role="status">{{ message }}</p>
    {% endfor %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Отправить обращение</button>
    </form>
  </div>
</div>
{% endblock %}
