{% extends "base.html" %}

{% block title %}Обратная связь — NETI{% endblock title %}

{% block maincontent %}
  <header class="page-banner page-banner-with-panel">
    <div class="container content-narrow page-heading"><h1>Обратная связь</h1></div>
  </header>
  <div class="container content-narrow raised-content">
    <div class="site-panel panel-padding">
      {% for message in messages %}
        <p class="alert alert-success" role="status">{{ message }}</p>
      {% endfor %}
      <form method="post" class="site-form">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="form-actions"><button type="submit" class="btn btn-primary">Отправить обращение</button></div>
      </form>
    </div>
  </div>
{% endblock maincontent %}
